# fly.toml app configuration file generated for t-cnicas-de-modelamiento-matem-tico on 2025-11-28T08:49:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 't-cnicas-de-modelamiento-matem-tico'
primary_region = 'gru'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
